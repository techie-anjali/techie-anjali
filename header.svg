<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="250">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes typeLine1 {
        0% { width: 0; }
        45%, 100% { width: 440px; }
      }
      @keyframes typeLine2 {
        0%, 50% { width: 0; }
        100% { width: 480px; }
      }
      .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1.5px; }
      .bar { fill: #161b22; }
      .btn-r { fill: #ff5f56; }
      .btn-y { fill: #ffbd2e; }
      .btn-g { fill: #27c93f; }
      .title { fill: #8b949e; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .prompt { fill: #00FF66; font-family: 'Fira Code', 'Courier New', monospace; font-size: 14.5px; font-weight: bold; }
      .glow-cmd { fill: #00FF66; font-family: 'Fira Code', 'Courier New', monospace; font-size: 14.5px; filter: drop-shadow(0 0 5px rgba(0,255,102,0.7)); }
      .output { fill: #c9d1d9; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
      .cursor { fill: #00FF66; animation: blink 0.8s infinite; }
      .type1 {
        overflow: hidden;
        white-space: nowrap;
        display: inline-block;
        animation: typeLine1 4s steps(30, end) infinite alternate;
      }
      .type2 {
        overflow: hidden;
        white-space: nowrap;
        display: inline-block;
        animation: typeLine2 4s steps(32, end) infinite alternate;
      }
    </style>
  </defs>

  <rect width="820" height="250" class="bg" />
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 810 0 C 815.523 0 820 4.477 820 10 L 820 36 L 0 36 Z" class="bar" />
  <circle cx="20" cy="18" r="5.5" class="btn-r" />
  <circle cx="38" cy="18" r="5.5" class="btn-y" />
  <circle cx="56" cy="18" r="5.5" class="btn-g" />
  <text x="410" y="23" text-anchor="middle" class="title">techie-anjali@production: ~/portfolio</text>

  <g transform="translate(25, 70)">
    <text x="0" y="0" class="prompt">techie-anjali@terminal:~$ </text>
    <foreignObject x="235" y="-16" width="550" height="28">
      <div xmlns="http://www.w3.org/1999/xhtml" class="type1 glow-cmd">
        whoami --role="Software Developer"
      </div>
    </foreignObject>

    <text x="0" y="30" class="output">┌─ Identity: Anjali Jha (B.Tech Information Technology)</text>
    <text x="0" y="52" class="output">├─ Focus: Backend Architecture • Distributed Systems • Cryptography</text>
    <text x="0" y="74" class="output">└─ Stack: Java 21 • Spring Boot • Microservices • MySQL</text>

    <text x="0" y="118" class="prompt">techie-anjali@terminal:~$ </text>
    <foreignObject x="235" y="102" width="550" height="28">
      <div xmlns="http://www.w3.org/1999/xhtml" class="type2 glow-cmd">
        ./deploy_mindset.sh --target="polymath"
      </div>
    </foreignObject>
    <rect x="585" y="106" width="8" height="15" class="cursor" />
  </g>
</svg>
